# 容器默认配置：数据库落在数据卷 /data（镜像内不含业务库，新卷即空库）
# 可用 compose 挂载宿主机 config.yaml 覆盖本文件。
server:
  port: 8080
  username: admin
  password: "123456"
  secret: "please-change-this-session-secret-32chars"
  session_max_age: 86400
  business_token: ""

database:
  path: "/data/assethub.db"

oss:
  endpoint: "oss-cn-beijing.aliyuncs.com"
  bucket: "your-bucket-name"
  access_key_id: "LTAI5txxxxxxxx"
  access_key_secret: "xxxxxxxxxxxxxxxx"
  private: true
  signed_expire: 3600
  url_prefix: "https://your-bucket-name.oss-cn-beijing.aliyuncs.com/"
