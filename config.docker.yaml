# 容器默认配置：数据库落在数据卷 /data（镜像内不含业务库，新卷即空库）
# OSS / 业务 token 登录后在设置页配置；无需挂载本文件也可部署。
# 若要改默认登录账号或 secret，可挂载宿主机 config.yaml 覆盖。
server:
  port: 8080
  username: admin
  password: "123456"
  secret: "please-change-this-session-secret-32chars"
  session_max_age: 86400

database:
  path: "/data/assethub.db"
