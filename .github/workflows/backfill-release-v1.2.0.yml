# 一次性：为本已推送的 v1.2.0 补 GitHub Release。成功后可删本文件。
name: backfill-release-v1.2.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill-release-v1.2.0.yml'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.2.0
          fetch-depth: 0

      - name: Create or update v1.2.0 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v1.2.0
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          BODY_FILE="${RUNNER_TEMP}/release-notes.md"
          {
            echo "## 变更说明"
            echo
            awk -v tag="$TAG" '
              $0 ~ "^## \\[" tag "\\]" { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md | sed -e 's/^[[:space:]]*$//' | awk 'NF{p=1} p'
            echo
            echo "---"
            echo
            echo "镜像：\`plushaddict/assethub:${VERSION}\` / \`plushaddict/assethub:latest\`"
            echo
            echo "完整日志见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${TAG}/CHANGELOG.md)。"
          } > "$BODY_FILE"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$BODY_FILE"
            echo "Updated existing release $TAG"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$BODY_FILE" --verify-tag
            echo "Created release $TAG"
          fi
