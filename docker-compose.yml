services:
  assethub:
    image: plushaddict/assethub:latest
    build:
      context: .
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      # SQLite 持久化；新卷为空库。要清空：docker compose down -v
      - assethub-data:/data
      # 可选：用宿主机 config.yaml 覆盖登录（见 config.docker.yaml）
      # - ./config.docker.yaml:/app/config.yaml:ro
    # 可选：覆盖登录（优先于挂载的 config.yaml；SECRET 非必须，公网再设）
    # environment:
    #   ASSETHUB_USERNAME: admin
    #   ASSETHUB_PASSWORD: "改成强密码"
    #   # ASSETHUB_SECRET: "改成至少32位随机字符串"
    restart: unless-stopped

volumes:
  assethub-data:
